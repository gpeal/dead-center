<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dead Center</title>
<meta name="description" content="Train your iPhone typing accuracy, one key at a time.">
<meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dead Center">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Figtree:wght@400..800&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#0F1522; --ink-2:#333B4B; --muted:#5E6778; --faint:#8A92A3; --line:#D9DDE5;
  --accent:#2458F0; --accent-ink:#FFFFFF; --accent-soft:#E2E9FE;
  --gold:#E3A000; --gold-ink:#6B4A00; --gold-soft:#FFF2CC;
  --red:#D93646; --red-soft:#FCE4E7; --green:#12915C; --green-soft:#DAF3E7;
  --shadow:0 1px 2px rgba(15,21,34,.05),0 10px 30px -12px rgba(15,21,34,.14);
  --kb-bg:#E1E2E7; --kb-key:#FFFFFF; --kb-key-down:#BFC3CB; --kb-ink:#000000; --kb-siri:#4A4B4D; --kb-edge:rgba(0,0,0,.13); --kb-pop:#FFFFFF; --kb-hi:rgba(255,255,255,.6);
  --f-display:"Anybody","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-kb:-apple-system,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;
  --r-card:18px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0F16; --surface:#151B26; --surface-2:#1B2230; --ink:#EDF1F7; --ink-2:#C9D0DC; --muted:#8F99AB; --faint:#667085; --line:#263042;
    --accent:#6F90FF; --accent-ink:#0B0F16; --accent-soft:#1C2748;
    --gold:#FFC53D; --gold-ink:#FFD980; --gold-soft:#372C0D;
    --red:#FF6B78; --red-soft:#3B1920; --green:#3DD598; --green-soft:#10301F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5);
    --kb-bg:#2B2B2E; --kb-key:#646468; --kb-key-down:#48484B; --kb-ink:#FFFFFF; --kb-siri:#AEAEB2; --kb-edge:rgba(255,255,255,.09); --kb-pop:#6C6C70; --kb-hi:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F16; --surface:#151B26; --surface-2:#1B2230; --ink:#EDF1F7; --ink-2:#C9D0DC; --muted:#8F99AB; --faint:#667085; --line:#263042;
  --accent:#6F90FF; --accent-ink:#0B0F16; --accent-soft:#1C2748;
  --gold:#FFC53D; --gold-ink:#FFD980; --gold-soft:#372C0D;
  --red:#FF6B78; --red-soft:#3B1920; --green:#3DD598; --green-soft:#10301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5);
  --kb-bg:#2B2B2E; --kb-key:#646468; --kb-key-down:#48484B; --kb-ink:#FFFFFF; --kb-siri:#AEAEB2; --kb-edge:rgba(255,255,255,.09); --kb-pop:#6C6C70; --kb-hi:rgba(255,255,255,.07);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:6px calc(var(--tab-h) + 24px)}
.screen{display:flex;flex-direction:column;gap:14px;animation:screenIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 0}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font:800 20px/1 var(--f-display);font-variation-settings:"wdth" 118;letter-spacing:-.01em}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding-inline:10px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font:600 13px/1 var(--f-body);white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip.gold{color:var(--gold-ink)}
.chip.gold svg{color:var(--gold)}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{background:var(--surface-2)}

.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-inline:2px}
.section-h h2{font:800 17px/1.2 var(--f-display);font-variation-settings:"wdth" 110}
.section-h .eyebrow{white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding-inline:20px;border-radius:16px;font:700 16px/1 var(--f-body);transition:transform .12s ease,filter .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.gold{background:var(--gold);color:#241800}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btn .sub{font-weight:500;opacity:.8;font-size:13px}
.linkbtn{color:var(--accent);font-weight:600}

/* ---------- level card ---------- */
.level{display:grid;grid-template-columns:1fr auto;gap:14px 16px;align-items:center}
.level .rank{display:flex;flex-direction:column;gap:6px;min-width:0}
.level .rank h1{font:800 26px/1.05 var(--f-display);font-variation-settings:"wdth" 122;letter-spacing:-.015em}
.xpbar{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--gold)));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.xpmeta{display:flex;justify-content:space-between;font:500 11px/1 var(--f-mono);color:var(--muted)}
.goal{position:relative;width:68px;height:68px}
.goal svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.goal .lbl b{font:800 18px/1 var(--f-display);font-variation-settings:"wdth" 120}
.goal .lbl span{display:block;font:500 8.5px/1 var(--f-mono);letter-spacing:.06em;color:var(--muted);margin-top:3px;text-transform:uppercase}

/* ---------- hero (first run) ---------- */
.hero{display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px;overflow:hidden;position:relative}
.hero h1{font:850 31px/.98 var(--f-display);font-variation-settings:"wdth" 128;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--ink-2);max-width:40ch}
.hero-stage{height:136px;border-radius:14px;background:var(--kb-bg);position:relative;overflow:hidden}
.hero-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 12px/1 var(--f-mono)}
.steps b{font-weight:700}
.steps span{color:var(--muted);font-size:14px}

/* ---------- play card ---------- */
.play{display:flex;flex-direction:column;gap:10px}
.play .btn.primary{height:60px;font-size:17px;justify-content:space-between;padding-inline:20px 16px}
.play .btn.primary .go{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.drillbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gold-soft);color:var(--gold-ink);border-radius:16px;padding:12px 14px 12px 12px;text-align:left;transition:transform .12s}
.drillbtn:active{transform:scale(.98)}
.drillbtn .keys{display:flex;gap:5px}
.drillbtn .t{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.2}
.drillbtn .t span{display:block;font-weight:500;font-size:12.5px;opacity:.85}
.drillbtn > svg{width:18px;height:18px;flex:none}

.kc{display:inline-grid;place-items:center;min-width:30px;height:34px;padding-inline:6px;border-radius:8px;background:var(--kb-key);color:var(--kb-ink);font:400 18px/1 var(--f-kb);box-shadow:0 0 0 1px var(--kb-edge),0 1px 0 var(--kb-edge)}
.kc.sm{min-width:24px;height:27px;font-size:14px;border-radius:7px}
.kc svg{width:.95em;height:auto}
.kc.lg{min-width:56px;height:64px;font-size:34px;border-radius:13px}
.kc.wide{padding-inline:10px;font-size:13px}

/* ---------- trouble keys ---------- */
.klist{display:flex;flex-direction:column;gap:8px}
.krow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px 12px 12px;box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .12s}
.krow:active{transform:scale(.985)}
.krow .d{min-width:0;display:flex;flex-direction:column;gap:3px}
.krow .d b{font-weight:700;font-size:15px;line-height:1.25}
.krow .d span{font-size:13px;color:var(--muted);line-height:1.3}
.krow .v{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.krow .v .num{font-size:20px;line-height:1}
.trend{display:inline-flex;align-items:center;gap:3px;font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:6px}
.trend.up{background:var(--green-soft);color:var(--green)}
.trend.down{background:var(--red-soft);color:var(--red)}
.trend.flat{background:var(--surface-2);color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:22px;padding-inline:8px;border-radius:99px;font:600 11px/1 var(--f-mono);letter-spacing:.02em;white-space:nowrap}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--gold-soft);color:var(--gold-ink)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.sample{background:var(--gold-soft);color:var(--gold-ink)}

/* recent rounds */
.rounds{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:1fr repeat(3,56px);gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line);font-size:14px}
.rrow:first-child{border-top:0}
.rrow .m{text-align:right;font:500 13px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.rrow .n{display:flex;flex-direction:column;gap:3px;min-width:0}
.rrow .n b{font-weight:600}
.rrow .n span{font:500 11px/1 var(--f-mono);color:var(--muted)}
.rhead{font:500 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:0 4px;border:0}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar .in{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 0 0 1px var(--line),0 12px 30px -10px rgba(0,0,0,.25)}
.tab{display:flex;align-items:center;gap:7px;height:44px;padding-inline:14px;border-radius:16px;color:var(--muted);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab .l{display:none}
.tab[aria-current="page"] .l{display:inline}

/* ---------- map ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapcard{padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px}
.mapwrap{position:relative;border-radius:14px;overflow:hidden;background:var(--kb-bg)}
.mapwrap canvas{position:absolute;left:0;top:0;pointer-events:none}
.legend{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--f-mono);color:var(--muted);padding-inline:4px;flex-wrap:wrap}
.legend .ramp{flex:1;min-width:80px;height:8px;border-radius:99px}
.legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.patterns{display:flex;flex-direction:column;gap:0}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:0}
.prow b{font-weight:700}
.prow p{grid-column:1/-1;color:var(--muted);font-size:13.5px}
.rowbars{display:grid;grid-template-columns:62px 1fr 44px;gap:8px 10px;align-items:center;font-size:13px}
.rowbars .track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rowbars .track i{display:block;height:100%;border-radius:99px}
.rowbars .m{font:500 12px/1 var(--f-mono);text-align:right}
.krowbar{grid-column:1/-1;display:grid;grid-template-columns:62px 1fr 44px;gap:10px;align-items:center;width:calc(100% + 16px);margin:-4px -8px;padding:4px 8px;border-radius:12px;text-align:left;transition:background .15s,transform .12s}
.krowbar .kc{justify-self:start}
.krowbar:active{background:var(--surface-2);transform:scale(.985)}
@media (hover:hover){.krowbar:hover{background:var(--surface-2)}}
.samplebar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink);font-size:13.5px;line-height:1.35}
.samplebar b{font-weight:700}
.samplebar .btn{height:36px;padding-inline:12px;font-size:13px;border-radius:10px;flex:none}

/* ---------- progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.tile .num{font-size:26px;line-height:1}
.tile .num small{font-size:14px;font-weight:600;margin-left:2px;color:var(--muted)}
.chartcard{padding:16px 14px 10px}
.chartcard .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.chart{width:100%;display:block}
.chart text{font:500 10px var(--f-mono);fill:var(--muted)}
.keys-mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px}
.km{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 10px/1 var(--f-mono);color:var(--muted)}
.km .ring{width:40px;height:40px;position:relative}
.km .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.km .ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 15px/1 var(--f-kb);color:var(--ink)}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.badge .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.badge .ic svg{width:20px;height:20px}
.badge b{display:block;font-weight:700;font-size:13.5px;line-height:1.2}
.badge span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.badge.locked{box-shadow:none;background:var(--surface-2)}
.badge.locked .ic{background:var(--bg);color:var(--faint)}
.badge.locked b{color:var(--muted)}
.settings{display:flex;flex-direction:column;padding:4px 16px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .t b{display:block;font-weight:600}
.set .t span{display:block;font-size:12.5px;color:var(--muted)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.seg.small{width:170px}
.seg.small button{height:28px;font-size:12.5px}
.danger{color:var(--red);font-weight:600}
textarea.backup{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:12px/1.4 var(--f-mono);padding:10px;resize:vertical}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding-block:4px 8px;line-height:1.5}

/* ---------- practice ---------- */
.practice{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
.practice .col{flex:1;min-height:0;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 0}
.p-top{display:flex;align-items:center;gap:10px}
.p-top .title{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.p-top .title b{font:800 14px/1 var(--f-display);font-variation-settings:"wdth" 112;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.segs i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--accent);border-radius:inherit;transition:width .2s}
.p-stats{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;margin-top:14px}
.ps{background:var(--surface);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative;overflow:hidden}
.ps .num{font-size:21px;line-height:1}
.ps .combo{display:flex;align-items:baseline;gap:6px}
.mult{font:700 12px/1 var(--f-mono);color:var(--gold-ink);background:var(--gold-soft);padding:3px 5px;border-radius:6px}
.mult.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.cbar{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);transition:width .15s}

    if(Math.hypot(x-MIC_C.x,y-MIC_C.y)<28) return 'mic';

/* ================= account sync: each person's private folder in the page's database =================
   iPhone wipes storage for pages embedded from another site when the app closes, so progress also lives
   server-side under data/users/<id>/, readable only by that person. Taps are split into 2,000-tap chunks. */
const CHUNK=2000,CAP=40000;
const SYNC={db:null,uid:null,state:IN_FRAME?'loading':'off',pushedTotal:0,cloudChunks:[],queue:Promise.resolve(),dirtyAll:false};
const chunkId=i=>'c'+String(i).padStart(6,'0');
const profRef=()=>SYNC.db.doc('data/users/'+SYNC.uid+'/profile');
const chunksCol=()=>profRef().collection('taps');
function cloudPush(full){
  if(!SYNC.db||!SYNC.uid||SYNC.state==='denied')return;
  if(full)SYNC.dirtyAll=true;
  SYNC.queue=SYNC.queue.then(async()=>{
    const base=S.tapBase||0,total=base+S.taps.length,first=Math.floor(base/CHUNK),last=Math.floor((total-1)/CHUNK);
    const from=SYNC.dirtyAll?first:Math.max(first,Math.floor(Math.min(SYNC.pushedTotal,total)/CHUNK));
    for(let c=from;c<=last;c++){const s=c*CHUNK-base;await chunksCol().doc(chunkId(c)).set({t:S.taps.slice(s,s+CHUNK)})}
    const keep=new Set();for(let c=first;c<=last;c++)keep.add(chunkId(c));
    for(const id of SYNC.cloudChunks)if(!keep.has(id))await chunksCol().doc(id).delete();
    SYNC.cloudChunks=[...keep];
    const{taps,...rest}=S;await profRef().set({state:rest,tapBase:base,total,rev:S.rev||0});
    SYNC.pushedTotal=total;SYNC.dirtyAll=false;SYNC.state='on';paintSync();
  }).catch(e=>{SYNC.dirtyAll=true;SYNC.state=e&&e.code==='invalid_argument'?'denied':'error';paintSync()});
}
function mergeStates(base,other){
  // keep everything from the newer copy, then add rounds (and their taps) that only the other copy has
  const ids=new Set(base.sessions.map(s=>s.id)),extra=other.sessions.filter(s=>!ids.has(s.id));
  if(!extra.length)return{s:base,changed:false};
  const sids=new Set(extra.map(s=>s.id));
  base.sessions=[...base.sessions,...extra].sort((a,b)=>a.id-b.id);
  base.taps=[...base.taps,...other.taps.filter(t=>sids.has(t[0]))].sort((a,b)=>a[0]-b[0]);
  base.xp=Math.max(base.xp,other.xp);base.ach=Object.assign({},other.ach,base.ach);
  base.bests={wpm:Math.max(base.bests.wpm,other.bests.wpm),combo:Math.max(base.bests.combo,other.bests.combo)};
  if(other.streak.last&&(!base.streak.last||other.streak.last>base.streak.last))base.streak=other.streak;
  base.streak.best=Math.max(base.streak.best||0,other.streak.best||0);
  if(base.taps.length>CAP){const k=Math.ceil((base.taps.length-CAP)/CHUNK)*CHUNK;base.taps=base.taps.slice(k);base.tapBase=(base.tapBase||0)+k}
  return{s:base,changed:true};
}
async function cloudInit(){
  const done=()=>{TAPS=null;SAMPLE=null;paintSync();rerender()};
  if(!window.claude||typeof window.claude.use!=='function'){SYNC.state='off';return done()}
  try{
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){SYNC.state='off';return done()}
    SYNC.db=db;SYNC.uid=uid;
    const snap=await profRef().get();
    if(!snap.exists){SYNC.state='on';if(S.sessions.length||S.taps.length)cloudPush(true);return done()}
    const d=snap.data(),q=await chunksCol().get();
    SYNC.cloudChunks=q.docs.map(x=>x.id);
    const first=Math.floor((d.tapBase||0)/CHUNK),taps=[];
    q.docs.filter(x=>parseInt(x.id.slice(1),10)>=first).sort((a,b)=>a.id<b.id?-1:1).forEach(x=>{const t=x.data().t;if(Array.isArray(t))taps.push(...t)});
    const cloud=hydrate(Object.assign({},d.state,{taps,tapBase:d.tapBase||0,rev:d.rev||0}));
    const local=S,localHas=local.sessions.length>0;
    let next=cloud,changed=false;
    if(localHas){const newer=(local.rev||0)>(cloud.rev||0);const m=newer?mergeStates(local,cloud):mergeStates(cloud,local);next=m.s;changed=newer||m.changed}
    S=next;SYNC.pushedTotal=(S.tapBase||0)+S.taps.length;SYNC.state='on';saveLocal();
    if(changed)cloudPush(true);
  }catch(e){SYNC.state='error'}

}

function attachInput(kb,onCommit){
  const act=new Map(),el=kb.el;
  const stop=e=>{if(e.cancelable)e.preventDefault()};
  el.addEventListener('touchstart',stop,{passive:false});el.addEventListener('touchmove',stop,{passive:false});el.addEventListener('touchend',stop,{passive:false});
  function press(a){
    const k=a.key;

  }
  function release(a){if(a.pop){a.pop.remove();a.pop=null}if(kb.keyEls[a.key])kb.keyEls[a.key].classList.remove('down')}
  function finish(id,a){act.delete(id);release(a);onCommit(a.key,a.down,a)}
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    for(const [id,a] of [...act]) finish(id,a); // rollover: a new touch commits the one still held
    const p=kb.toKb(e.clientX,e.clientY);const a={down:p,key:hitTest(p.x,p.y),type:e.pointerType,pop:null};
    act.set(e.pointerId,a);press(a);

  });
  el.addEventListener('pointermove',e=>{
    const a=act.get(e.pointerId);if(!a)return;
    const p=kb.toKb(e.clientX,e.clientY),k=hitTest(p.x,p.y);
    if(k!==a.key){release(a);a.key=k;press(a)}
  });
  el.addEventListener('pointerup',e=>{const a=act.get(e.pointerId);if(a)finish(e.pointerId,a)});
  el.addEventListener('pointercancel',e=>{const a=act.get(e.pointerId);if(a){act.delete(e.pointerId);release(a)}});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

function statsFor(taps,k,win=100){
  const arr=[];for(let i=taps.length-1;i>=0&&arr.length<win;i--)if(taps[i].k===k)arr.push(taps[i]);
  arr.reverse();const n=arr.length,key=KEY[k];
  if(!n) return {k,n:0,acc:0,prec:0,mastery:0,conf:{},arr};
  let hits=0,sx=0,sy=0,sxx=0,syy=0,ps=0;const conf={},dtH=[],dtM=[];
  for(const t of arr){sx+=t.dx;sy+=t.dy;sxx+=t.dx*t.dx;syy+=t.dy*t.dy;
    if(t.h===k){hits++;ps+=1-Math.min(1,edist(t.dx,t.dy,key));if(t.dt>0&&t.dt<2500)dtH.push(t.dt)}
    else{conf[t.h]=(conf[t.h]||0)+1;if(t.dt>0&&t.dt<2500)dtM.push(t.dt)}}
  const mx=sx/n,my=sy/n,sdx=Math.sqrt(Math.max(0,sxx/n-mx*mx)),sdy=Math.sqrt(Math.max(0,syy/n-my*my));
  const acc=hits/n,prec=hits?ps/hits:0;
  return{k,n,hits,acc,prec,mx,my,sdx,sdy,conf,dtH,dtM,arr,mastery:Math.round(100*(.78*acc+.22*prec))};
}
const masteryLabel=m=>m>=92?['Mastered','good']:m>=84?['Solid','ok']:m>=72?['Shaky','warn']:['Needs work','bad'];
function sessionSeries(taps,k){

  return [...by.entries()].filter(([,o])=>o.n>=3).sort((a,b)=>a[0]-b[0]).map(([sid,o])=>({sid,acc:o.h/o.n}));
}
function keyTrend(taps,k){
  const arr=taps.filter(t=>t.k===k);if(arr.length<20)return null;
  const m=Math.min(50,Math.floor(arr.length/2));const a=arr.slice(-2*m,-m),b=arr.slice(-m);
  const acc=x=>x.filter(t=>t.h===k).length/x.length;return acc(b)-acc(a);

function drillImpact(taps,sessions,k){

  if(!first)return null;

}

    fixes.push('Finish each word, then tap space lightly.');

    if(sigY&&s.my>0){why.push(`Your ${L} taps land ${fmt1(s.my)} pt below center: your thumb pad meets the glass lower than where you look${key.row===0?', worst on the stretched top row':''}.`);fixes.push(`Aim at the top edge of ${L}, not its middle.`)}

    else if(sigX){why.push(`Your ${L} taps drift ${fmt1(Math.abs(s.mx))} pt ${s.mx>0?'right':'left'}: your thumb comes in at an angle.`);fixes.push(`Aim slightly toward the keyboard's center on ${L}.`);fixes.push('Bring your thumb in from below rather than from the side.')}

  if(!sigX&&!sigY&&spread>.42){why.push(`Your average is near center, but taps spread ±${fmt1(Math.max(s.sdx,s.sdy))} pt. It's consistency, not aim.`);fixes.push(`Drill ${L} at about 80% of your usual speed.`);fixes.push('Keep your thumbs hovering close to the glass.')}
  if(rushing){why.push(`Misses came ${Math.round(median(s.dtM))} ms after the previous tap vs ${Math.round(median(s.dtH))} ms on hits. You're rushing ${L}.`);fixes.push(`Take a half beat before ${L}.`)}
  if(trans){const p=trans[0],pl=p==='_'?'space':lab(p);why.push(`Most misses come right after ${pl} (${trans[1].m} of ${trans[1].n} times).`);fixes.push(`Practice the ${pl} to ${L} jump on its own.`)}

  if(!fixes.length) fixes.push(`Keep ${L} in rotation.`);
  if(EDGE.has(k)&&(sigX||s.acc<.9)) fixes.push('Typing one-handed? Hold the emoji key and pick a one-handed layout.');
  return{headline,short,why,fixes:[...new Set(fixes)].slice(0,3),tone:s.acc>=.95?'good':s.acc>=.88?'warn':'bad'};
}
function troubleKeys(taps,max=3){
  const out=[];

function patterns(taps){

    else out.push({t:'Edge keys hold up',v:`${pct(ea)}% vs ${pct(ma)}%`,p:'Q, A, Z, P and L keep pace with the middle. Reach is fine.'})}

/* ================= sample data (shown until you have your own) ================= */
function makeSample(){
  const r=rng(11),taps=[],sessions=[];const start=Date.now()-13*864e5;
  const bias=k=>{const key=KEY[k];let bx=0,by=2.4;if(key.row===0)by+=1.8;if('qaz'.includes(k))bx+=3.6;if('pl'.includes(k))bx-=4.6;if(k==='o')bx-=2.8;if(k==='b')bx+=2.4;if(k==='n')bx-=2.2;if(k==='space')by=-5.2;return[bx,by]};
  for(let s=0;s<14;s++){
    const sid=start+s*864e5+r()*3e7,imp=1-s*.045;let n=0,h=0,ps=0,lines=[];
    for(let i=0;i<3;i++)lines.push(SENTENCES[Math.floor(r()*SENTENCES.length)]);
    for(const line of lines){let prev='';for(const ch of line){const k=ch===' '?'space':ch.toLowerCase(),key=KEY[k];const[bx,by]=bias(k),sd=3.3*imp+1.5;
      for(let tries=0;tries<3;tries++){const dx=bx*imp+gauss(r)*sd*(k==='space'?3:1),dy=by*imp+gauss(r)*sd*.85;const hit=hitTest(key.cx+dx,key.cy+dy);
        taps.push({sid,k,h:hit,dx,dy,p:prev,dt:Math.round(150+r()*170)});n++;if(hit===k){h++;ps+=1-Math.min(1,edist(dx,dy,key));break}}
      prev=ch===' '?'_':ch.toLowerCase()}}
    sessions.push({id:sid,ts:sid,mode:s===0?'baseline':s%3===2?'drill':'round',focus:s%3===2?'pl':'',n,hits:h,acc:h/n,prec:ps/h,wpm:30+s*1.1+r()*3,score:0,combo:0});
  }

}

function weights(){const t=allTaps(),w={};for(const k of TRAINABLE){const s=statsFor(t,k,60);w[k]=s.n>=6?1+4*(1-s.acc)+1.5*(1-s.prec):1.3}return w}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function adaptiveLines(n){
  const w=weights(),used=new Set(S.used.slice(-45));
  const cand=SENTENCES.map((s,i)=>({i,s,sc:[...s].reduce((a,c)=>a+(w[c===' '?'space':c.toLowerCase()]||1)+(c!==c.toLowerCase()?w.shift:0),0)/s.length+Math.random()*.6})).filter(o=>!used.has(o.i)).sort((a,b)=>b.sc-a.sc);

}
function drillLines(focus,n){
  const F=new Set(focus.filter(k=>k!=='space'&&k!=='shift')),sp=focus.includes('space'),sh=focus.includes('shift'),t=allTaps(),pairs=[];
  for(const k of focus){const s=statsFor(t,k,80);const top=Object.entries(s.conf).sort((a,b)=>b[1]-a[1])[0];if(top&&KEY[top[0]]&&KEY[top[0]].type==='letter'&&k!=='space')pairs.push(k+top[0],top[0]+k)}

  const pool=WORDS.map(w=>({w,s:sc(w)+(sh?.3:0)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,90).map(o=>o.w);
  const dens=s=>[...s].filter(c=>F.has(c.toLowerCase())||(sp&&c===' ')||(sh&&c!==c.toLowerCase())).length/s.length;
  const best=SENTENCES.map(s=>({s,d:dens(s)+Math.random()*.03})).sort((a,b)=>b.d-a.d);

function checkAch(sess){
  const got=[],give=id=>{if(!S.ach[id]){S.ach[id]=Date.now();got.push(ACH.find(a=>a.id===id))}};

function smoothPath(pts){if(pts.length<2)return'';let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=`C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`}return d}
function lineChart(host,{series,yMin,yMax,ticks,fmt=v=>v,height=160,xLabel=i=>'#'+(i+1)}){
  const W=Math.max(240,host.clientWidth||320),H=height,pl=34,pr=16,pt=14,pb=22;
  const n=Math.max(...series.map(s=>s.values.length));if(!n){host.innerHTML='';return}
  const X=i=>n<=1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1),Y=v=>pt+(1-(v-yMin)/(yMax-yMin))*(H-pt-pb);
  let g='';
  for(const t of ticks)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--line)" stroke-width="1" ${t===ticks[0]?'':'stroke-dasharray="2 4"'}/><text x="${pl-8}" y="${Y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`;
  g+=`<text x="${X(0)}" y="${H-5}" text-anchor="${n>1?'start':'middle'}">${xLabel(0)}</text>`;if(n>1)g+=`<text x="${X(n-1)}" y="${H-5}" text-anchor="end">${xLabel(n-1)}</text>`;
  series.forEach((s,si)=>{
    const pts=s.values.map((v,i)=>[X(i),Y(clamp(v,yMin,yMax))]);
    if(si===0&&pts.length>1){const id='g'+Math.random().toString(36).slice(2,7);g+=`<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${s.color};stop-opacity:.22"/><stop offset="1" style="stop-color:${s.color};stop-opacity:0"/></linearGradient></defs><path d="${smoothPath(pts)}L${pts[pts.length-1][0]},${Y(yMin)}L${pts[0][0]},${Y(yMin)}Z" fill="url(#${id})"/>`}
    if(pts.length>1)g+=`<path d="${smoothPath(pts)}" fill="none" style="stroke:${s.color}" stroke-width="${s.w||2.4}" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 4"':''}/>`;
    const lp=pts[pts.length-1];g+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" style="fill:${s.color};stroke:var(--surface)" stroke-width="2.5"/>`;
  });
  host.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${series.map(s=>s.label).join(' and ')} by round">${g}</svg>`;
}

function paintSound(){$('#pSound').innerHTML=S.settings.sound?IC.soundOn:IC.soundOff;$('#pSound').setAttribute('aria-pressed',String(S.settings.sound))}
function startRound(mode,focus){
  focus=(focus||[]).filter(Boolean);

  R={mode,focus,lines,li:0,ci:0,state:[],taps:[],t0:0,tLast:0,score:0,combo:0,maxCombo:0,bull:0,maxBull:0,scored:0,good:0,precSum:0,precN:0,caseSlips:0,shift:'on',lastShiftT:0,hist:[],realigns:0,hintHtml:null,sid:Date.now(),done:false};
  closeSheet();if(!KB)buildPractice();
  $('#practice').hidden=false;document.documentElement.style.overflow='hidden';

  $('#pHint').innerHTML=COARSE?hint:hint+' <span class="muted">(Mouse works, but thumbs are what this measures.)</span>';R.hintHtml=$('#pHint').innerHTML;
  updStats();renderLine(true);
}
function renderLine(enter){
  const line=R.lines[R.li];const F=new Set(R.mode==='drill'?R.focus:[]);R.state=[];
  let h='',w='';
  for(let i=0;i<line.length;i++){const ch=line[i],up=ch!==ch.toLowerCase();const cls='c'+(ch===' '?' sp':'')+(F.has(ch.toLowerCase())||(ch===' '&&F.has('space'))||(up&&F.has('shift'))?' focus':'');const span=`<span class="${cls}" data-i="${i}">${ch}</span>`;
    if(ch===' '){h+=`<span class="w">${w}</span>${span}`;w=''}else w+=span}
  h+=`<span class="w">${w}</span>`;
  const el=$('#pLine');el.innerHTML=h;if(enter){el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter')}

  $$('#pLine .c').forEach((s,i)=>{const st=R.state[i];s.classList.toggle('done',i<R.ci);s.classList.toggle('cur',i===R.ci);s.classList.toggle('missed',i<R.ci&&(st==='miss'||st==='case'));s.classList.toggle('skipped',i<R.ci&&st==='skip');s.classList.toggle('fixed',i<R.ci&&st==='fixed')});

function updStats(){
  $('#pAcc').textContent=R.scored?pct(R.good/R.scored)+'%':'–';$('#pCombo').textContent=R.combo;$('#pScore').textContent=R.score;
  const m=mult(R.combo);const me=$('#pMult');if(me.textContent!=='×'+m){me.textContent='×'+m;if(m>1){me.classList.remove('pop');void me.offsetWidth;me.classList.add('pop')}}
  const tiers=[0,10,25,50,1e9],ti=tiers.findIndex((t,i)=>R.combo>=t&&R.combo<tiers[i+1]);$('#pCbar').style.width=m>=4?'100%':pct((R.combo-tiers[ti])/(tiers[ti+1]-tiers[ti]))+'%';

function record(tk,hit,down,dt,prev){const key=KEY[tk],dx=down.x-key.cx,dy=down.y-key.cy;R.taps.push([R.sid,tk,hit,Math.round(dx*10),Math.round(dy*10),prev,Math.min(dt,9999)]);return{dx,dy,key}}
function score(ok,r,live=true){
  R.scored++;
  if(!ok){R.combo=0;R.bull=0;return}
  R.good++;const q=quality(r.dx,r.dy,r.key);R.precSum+=1-Math.min(1,edist(r.dx,r.dy,r.key));R.precN++;
  const pts=(q==='bull'?3:q==='good'?2:1)*mult(R.combo);R.score+=pts;R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);
  if(q==='bull'){R.bull++;R.maxBull=Math.max(R.maxBull,R.bull);if(live){$$('#pScoreBox .floater').forEach(x=>x.remove());const f=document.createElement('span');f.className='floater';f.textContent='+'+pts;$('#pScoreBox').appendChild(f);setTimeout(()=>f.remove(),700)}}else R.bull=0;
}
/* ---- realignment: undo and replay the last few keystrokes when the typist has slipped one letter out of step ---- */
const SNAP_KEYS=['ci','scored','good','precSum','precN','score','combo','maxCombo','bull','maxBull','caseSlips','shift'];
function snapshot(){const s={state:R.state.slice(),tapsLen:R.taps.length};for(const k of SNAP_KEYS)s[k]=R[k];return s}
function restore(s){for(const k of SNAP_KEYS)R[k]=s[k];R.state=s.state.slice();R.taps.length=s.tapsLen}
// type the current character with one tap; returns what happened so it can be undone later
function typeKey(hit,down,dt,live){
  const line=R.lines[R.li],ch=line[R.ci],exp=expectedKey(),tk=exp==='shift'?ch.toLowerCase():exp;
  const prev=R.ci>0?(line[R.ci-1]===' '?'_':line[R.ci-1].toLowerCase()):'';
  const snap=snapshot(),r=record(tk,hit,down,dt,prev);
  const keyOk=hit===tk;let ok=keyOk;
  if(keyOk&&tk!=='space'&&(R.shift!=='off')!==(ch!==ch.toLowerCase())){ok=false;R.caseSlips++}
  score(ok,r,live);
  R.state[R.ci]=ok?(R.state[R.ci]==='miss'?'fixed':'ok'):keyOk?'case':'miss';
  if(R.shift==='on')R.shift='off';
  const pos=R.ci;R.ci++;
  return{hit,down,dt,snap,pos,ok,keyOk};
}
function replay(evs){R.hist=[];for(const e of evs)R.hist.push(typeKey(e.hit,e.down,e.dt,false))}
function tryRealign(){
  const H=R.hist,n=H.length,line=R.lines[R.li];
  const K=i=>{const c=line[i];return c==null?null:c===' '?'space':c.toLowerCase()};
  // skipped 1-2 letters: two misses in a row that each match the letter(s) ahead
  if(n>=2){const e1=H[n-2],e2=H[n-1];
    if(!e1.keyOk&&!e2.keyOk&&e2.pos===e1.pos+1){
      for(const d of[1,2]){if(K(e1.pos+d)===e1.hit&&K(e2.pos+d)===e2.hit){
        restore(e1.snap);for(let i=0;i<d;i++)R.state[e1.pos+i]='skip';R.ci=e1.pos+d;replay([e1,e2]);
        return{type:'skip',chars:line.slice(e1.pos,e1.pos+d)}}}}}
  // an extra tap: three misses where the last two each match the letter behind them
  if(n>=3){const e0=H[n-3],e1=H[n-2],e2=H[n-1];
    if(!e0.keyOk&&!e1.keyOk&&!e2.keyOk&&e1.pos===e0.pos+1&&e2.pos===e1.pos+1&&K(e0.pos)===e1.hit&&K(e1.pos)===e2.hit){
      if(e0.pos>0&&e0.hit===K(e0.pos-1)){restore(e0.snap);replay([e1,e2]);return{type:'double'}}   // double tap: drop the extra tap
      restore(e1.snap);R.ci=e0.pos;replay([e1,e2]);return{type:'retype'}                           // missed, then retyped without deleting: keep the first miss
    }}
  return null;
}
function flashHint(html){const h=$('#pHint');if(!R.hintHtml)R.hintHtml=h.innerHTML;h.innerHTML=html;clearTimeout(R.hintT);R.hintT=setTimeout(()=>{if(R&&R.hintHtml)h.innerHTML=R.hintHtml},2600)}
function onKey(hit,down){
  if(!R||R.done)return;
  const line=R.lines[R.li],ch=line[R.ci];
  const now=performance.now();if(!R.t0)R.t0=now;const dt=R.tLast?Math.round(now-R.tLast):0;R.tLast=now;
  const prev=R.ci>0?(line[R.ci-1]===' '?'_':line[R.ci-1].toLowerCase()):'';
  const exp=expectedKey();
  if(hit==='shift'){
    R.hist=[];
    const dbl=now-R.lastShiftT<350;R.lastShiftT=now;
    if(exp==='shift'){score(true,record('shift','shift',down,dt,prev));R.shift='on';sound('mod')}
    else if(R.shift==='off'){score(false,record(exp,'shift',down,dt,prev));R.shift='on';sound('miss');shakeAt(R.ci)} // stray Shift while aiming at a letter
    else if(R.shift==='on'&&dbl){R.shift='caps';sound('mod')}                                                        // double tap: caps lock
    else{R.shift='off';sound('mod')}                                                                                // turning it back off
    buzz();paintCursor();updStats();return;
  }
  if(hit==='del'){
    R.hist=[];
    const ps=R.ci>0?R.state[R.ci-1]:null;
    if(ps==='ok'||ps==='fixed'||ps==null){score(false,record(exp==='shift'?ch.toLowerCase():exp,'del',down,dt,prev));sound('miss')} // deleting a correct letter means Delete was a miss
    else sound('mod');                                                                                                                   // fixing a typo is fine
    if(R.ci>0){R.ci--;R.state.length=R.ci}
    if(R.shift!=='caps')R.shift=R.ci===0?'on':'off';
    buzz();paintCursor();updStats();return;
  }
  // any other key types (or tries to type) the current character, then the cursor moves on
  const ev=typeKey(hit,down,dt,true);(R.hist||(R.hist=[])).push(ev);if(R.hist.length>4)R.hist.shift();
  const re=!ev.keyOk?tryRealign():null;
  if(re){
    R.realigns=(R.realigns||0)+1;sound('key');
    const msg=re.type==='skip'?`Skipped “${re.chars.replace(/ /g,'space')}”. Realigned and not counted.`:re.type==='double'?'Extra tap ignored. Realigned.':'Retyped letter caught. Only the first miss counts.';
    flashHint(`<span class="pill ok">Back in step</span> ${msg}`);
  }else if(ev.ok)sound(ch===' '?'mod':'key');else{sound('miss');shakeAt(ev.pos)}
  buzz();
  if(R.ci>=line.length){R.li++;R.ci=0;R.hist=[];if(R.shift!=='caps')R.shift='on';if(R.li>=R.lines.length){updStats();return finishRound()}renderLine(true)}else paintCursor();
  updStats();
}
function commitTaps(taps){S.taps.push(...taps);if(S.taps.length>CAP){const k=Math.ceil((S.taps.length-CAP)/CHUNK)*CHUNK;S.taps=S.taps.slice(k);S.tapBase=(S.tapBase||0)+k}}
const focusCode=k=>k==='space'?'_':k==='shift'?'^':k;
function endPractice(abort){
  if(abort&&R&&!R.done&&R.taps.length>=15){commitTaps(R.taps);S.sessions.push({id:R.sid,ts:Date.now(),mode:R.mode,focus:'',n:R.scored,hits:R.good,acc:R.good/Math.max(1,R.scored),partial:true});save();SAMPLE=null}
  R=null;$('#practice').hidden=true;document.documentElement.style.overflow='';show(view);
}
function finishRound(){
  R.done=true;
  const n=R.scored,acc=R.good/n,prec=R.precN?R.precSum/R.precN:0,dur=Math.max(1,(R.tLast-R.t0)/1000),chars=R.lines.reduce((a,l)=>a+l.length,0),wpm=chars/5/(dur/60);
  const sess={id:R.sid,ts:Date.now(),mode:R.mode,focus:R.focus.map(focusCode).join(''),n,hits:R.good,acc,prec,wpm:Math.round(wpm*10)/10,score:R.score,combo:R.maxCombo,bull:R.maxBull,dur:Math.round(dur),caseSlips:R.caseSlips};
  const before=levelInfo(S.xp);const xp=Math.round(R.score/10)+15+(acc===1?25:acc>=.97?10:0)+(R.mode==='baseline'?30:0)+(R.mode==='drill'?10:0);
  S.xp+=xp;const after=levelInfo(S.xp);
  const prevBest=S.bests.wpm,prevRounds=realSessions().length;
  commitTaps(R.taps);S.sessions.push(sess);SAMPLE=null;
  const d=today();if(S.streak.last!==d){const diff=S.streak.last?dayDiff(S.streak.last,d):99;S.streak.count=diff===1?S.streak.count+1:1;S.streak.last=d;S.streak.best=Math.max(S.streak.best,S.streak.count)}
  if(S.daily.day!==d)S.daily={day:d,rounds:0};S.daily.rounds++;
  const pbW=prevRounds>=2&&wpm>prevBest&&acc>=.9;S.bests.wpm=Math.max(S.bests.wpm,wpm);S.bests.combo=Math.max(S.bests.combo,R.maxCombo);
  TAPS=null;const got=checkAch(sess);save();
  const roundTaps=R.taps.map(toObj);const r=R;
  setTimeout(()=>{$('#practice').hidden=true;document.documentElement.style.overflow='';showResults(sess,xp,before,after,got,roundTaps,pbW,r)},350);
}
function drawDots(cv,kb,taps){
  const dpr=devicePixelRatio||1,W=kb.el.clientWidth,H=kb.el.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const c=cv.getContext('2d');c.scale(dpr,dpr);const g=cssVar('--green'),rd=cssVar('--red'),wh=cssVar('--kb-key');
  const draw=miss=>{for(const t of taps){if((t.h!==t.k)!==miss)continue;const key=KEY[t.k];const p=kb.toPx(key.cx+t.dx,key.cy+t.dy);c.beginPath();c.arc(p.x,p.y,miss?3.6:3,0,7);c.fillStyle=miss?rd:g;c.globalAlpha=miss?.95:.7;c.fill();if(miss){c.globalAlpha=1;c.strokeStyle=wh;c.lineWidth=1;c.stroke()}}};
  draw(false);draw(true);c.globalAlpha=1;
}
function showResults(s,xp,before,after,got,taps,pbW,r){
  const grade=s.acc>=.99&&s.prec>=.6?'Dead center.':s.acc>=.96?'Sharp.':s.acc>=.9?'Solid.':s.acc>=.8?'Getting there.':'Wobbly.';
  const stars=(s.acc>=.9)+(s.acc>=.96)+(s.acc>=.99||(s.acc>=.975&&s.prec>=.6));
  const byKey={};for(const t of taps)if(t.h!==t.k){(byKey[t.k]||(byKey[t.k]=[])).push(t)}
  const missKeys=Object.entries(byKey).sort((a,b)=>b[1].length-a[1].length).slice(0,3);
  const lvUp=after.lvl>before.lvl;
  const ov=document.createElement('div');ov.className='overlay';ov.id='results';
  let h=`<div class="app"><div class="screen"><div class="res-hero"><span class="eyebrow">${modeName(s)} complete</span><h1>${grade}</h1><div class="stars" aria-label="${stars} of 3">${[0,1,2].map(i=>starSvg(i<stars)).join('')}</div></div>
    <div class="statgrid"><div class="tile"><span class="eyebrow">Accuracy</span><span class="num" data-cu="${s.acc*100}" data-suf="%">0</span></div><div class="tile"><span class="eyebrow">Centered</span><span class="num" data-cu="${s.prec*100}" data-suf="%">0</span></div><div class="tile"><span class="eyebrow">Speed</span><span class="num" data-cu="${s.wpm}" data-suf=" wpm">0</span></div><div class="tile"><span class="eyebrow">Best combo</span><span class="num" data-cu="${s.combo}">0</span></div></div>
    <div class="section-h"><h2>Where you landed</h2><span class="eyebrow">${taps.length} taps</span></div>
    <section class="card mapcard"><div class="mapwrap" id="rmap"><canvas id="rmapCv"></canvas></div><div class="legend"><span class="dot" style="background:var(--green)"></span>hit <span class="dot" style="background:var(--red)"></span>miss </div></section>
    <section class="card xpcard"><div class="row"><span class="eyebrow">Score ${s.score}</span><b class="num" style="font-size:22px;color:var(--accent)">+${xp} XP</b></div><div class="bar"><i id="rxp" style="width:${lvUp?0:pct(before.into/before.need)}%"></i></div><div class="xpmeta"><span>Level ${after.lvl} · ${after.rank}</span><span>${after.into} / ${after.need}</span></div></section>`;
  if(lvUp)h+=`<div class="levelup">${IC.bolt}<div><b>Level ${after.lvl}${after.rank!==before.rank?` · ${after.rank}`:''}</b><span>${after.rank!==before.rank?'New rank unlocked.':'Keep the streak going.'}</span></div></div>`;
  if(pbW)h+=`<div class="samplebar" style="background:var(--green-soft);color:var(--green)"><b>New speed record: ${Math.round(s.wpm)} wpm.</b></div>`;
  h+=`<div class="section-h"><h2>This round</h2></div><section class="card notes">`;
  if(missKeys.length)h+=missKeys.map(([k,arr])=>{const hits={};arr.forEach(t=>hits[t.h]=(hits[t.h]||0)+1);const topH=Object.entries(hits).sort((a,b)=>b[1]-a[1])[0];const mx=arr.reduce((a,t)=>a+t.dx,0)/arr.length,my=arr.reduce((a,t)=>a+t.dy,0)/arr.length;return`<div class="note">${kc(k)}<span><b>${arr.length} miss${arr.length>1?'es':''}</b>, mostly onto ${lab(topH[0])}, ${dirWords(mx,my)} of center.</span></div>`}).join('');
  if(r.caseSlips)h+=`<div class="note">${kc('shift')}<span><b>${r.caseSlips} wrong-case letter${r.caseSlips>1?'s':''}.</b> Right key, but Shift was ${r.caseSlips>1?'off or left on':'in the wrong state'}.</span></div>`;
  if(r.realigns)h+=`<div class="note"><span class="kc" aria-hidden="true">⇆</span><span><b>Got out of step ${r.realigns} time${r.realigns>1?'s':''}.</b> Letters after each slip weren't counted.</span></div>`;
  if(!missKeys.length&&!r.caseSlips)h+=`<div class="note">${starSvg(true).replace('<svg','<svg width="34" height="34"')}<span><b>No misses.</b> ${r.maxBull>=5?`Best bullseye run: ${r.maxBull}.`:'Every tap found its key.'}</span></div>`;
  h+=`</section>`;
  if(got.length)h+=`<div class="section-h"><h2>Unlocked</h2></div><div class="ach">${got.map(a=>`<div class="badge"><span class="ic">${IC[a.ic]}</span><div><b>${a.name}</b><span>${a.desc}</span></div></div>`).join('')}</div>`;
  const tk=troubleKeys(allTaps());const focus=missKeys.length?missKeys.slice(0,2).map(m=>m[0]):tk.slice(0,2).map(t=>t.k);
  h+=`<div class="btnstack"><button class="btn primary block" data-act="round">${IC.play}Next round</button>${focus.length?`<button class="btn gold block" data-act="drill" data-focus="${focus.join(',')}">${IC.target}Drill ${focus.map(lab).join(' and ')}</button>`:''}<button class="btn ghost block" data-act="close-results" data-then="map">See my tap map</button><button class="linkbtn" data-act="close-results" data-then="home" style="padding:8px">Done</button></div></div></div>`;
  ov.innerHTML=h;app.hidden=true;$('.tabbar').hidden=true;document.body.appendChild(ov);ov.addEventListener('click',onClick);window.scrollTo(0,0);
  const rkb=Keyboard($('#rmap'),{live:false});$('#rmap').insertBefore(rkb.el,$('#rmapCv'));rkb.layout();drawDots($('#rmapCv'),rkb,taps);
  $$('[data-cu]',ov).forEach(e=>countUp(e,+e.dataset.cu,{fmt:v=>Math.round(v)+(e.dataset.suf||'')}));
  setTimeout(()=>{const b=$('#rxp');if(b)b.style.width=pct(after.into/after.need)+'%'},450);
  if(lvUp||s.hits===s.n||pbW){setTimeout(confetti,350);sound('chime')}
  got.forEach(a=>toast(a.ic,a.name,a.desc));
}

/* ================= events ================= */
function onClick(e){
  const t=e.target.closest('[data-act],[data-go],[data-key],[data-map],[data-set],[data-len]');if(!t)return;
  if(t.dataset.go){closeSheet();show(t.dataset.go);return}
  if(t.dataset.key&&!t.dataset.act){openKey(t.dataset.key);return}
  if(t.dataset.map){mapMode=t.dataset.map;$$('[data-map]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.map===mapMode)));paintMap();return}
  if(t.dataset.set){const k=t.dataset.set;S.settings[k]=!S.settings[k];save();t.setAttribute('aria-checked',String(S.settings[k]));if(k==='haptics'&&S.settings[k])buzz();return}
  if(t.dataset.len){S.settings.len=+t.dataset.len;save();$$('[data-len]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.len===S.settings.len)));return}
  const a=t.dataset.act;
  const closeRes=()=>{const r=$('#results');if(r)r.remove();app.hidden=false;$('.tabbar').hidden=false};
  if(a==='baseline'){closeRes();startRound('baseline')}
  else if(a==='round'){closeRes();startRound('round')}
  else if(a==='drill'){closeRes();startRound('drill',(t.dataset.focus||'').split(','))}
  else if(a==='close-results'){closeRes();show(t.dataset.then||'home')}
  else if(a==='backup'){const txt=JSON.stringify(S);const ta=$('#restoreTa');const fallback=()=>{ta.value=txt;ta.focus();ta.select();toast('copy','Backup is in the box below','Select all and copy it')};try{navigator.clipboard.writeText(txt).then(()=>toast('copy','Backup copied','Paste it into Restore on another device'),fallback)}catch(_){fallback()}}
  else if(a==='restore'){try{const o=JSON.parse($('#restoreTa').value);if(!Array.isArray(o.taps)||!Array.isArray(o.sessions))throw 0;S=hydrate(o);save(true);SAMPLE=null;toast('check','Backup restored',`${o.sessions.length} rounds, ${o.taps.length.toLocaleString()} taps`);show('progress')}catch(_){toast('close','That backup could not be read','Paste the full text from Copy backup')}}
  else if(a==='reset'){if(t.dataset.armed){S=fresh();save(true);SAMPLE=null;toast('check','Everything erased','Start fresh with the baseline');show('home')}else{t.dataset.armed='1';t.textContent='Tap again to erase';setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='Erase'}},3000)}}
}

/* ================= boot ================= */
function boot(){
  app.innerHTML=`<main class="screen" id="screen-home"></main><main class="screen" id="screen-map" hidden></main><main class="screen" id="screen-progress" hidden></main>`;
  const nav=document.createElement('nav');nav.className='tabbar';nav.setAttribute('aria-label','Sections');
  nav.innerHTML=`<div class="in">${[['home','Today',IC.target],['map','Map',IC.kbd],['progress','Progress',IC.chart]].map(([id,l,ic])=>`<button class="tab" data-go="${id}" aria-label="${l}">${ic}<span class="l">${l}</span></button>`).join('')}</div>`;
  document.body.appendChild(nav);
  document.addEventListener('click',e=>{if(e.target.closest('.sheetp,#results'))return;onClick(e)});
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(R&&KB)KB.layout();if(view==='map'&&MAPKB){MAPKB.layout();paintMap()}if(view==='progress')renderProgress()},120)});
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(view==='map')paintMap()});
  new MutationObserver(()=>{if(view==='map')paintMap()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  const hash=(location.hash||'').slice(1);show(['map','progress'].includes(hash)?hash:'home');
  cloudInit();setTimeout(()=>{if(SYNC.state==='loading'){SYNC.state='off';rerender()}},9000);
  if(!IN_FRAME&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol))watchUpdates();
}
/* ================= update banner ================= */
function watchUpdates(){
  const sw=navigator.serviceWorker,hadCtl=!!sw.controller;let last=Date.now();
  sw.addEventListener('message',e=>{if(e.data&&e.data.type==='update-ready')showUpdate()});
  sw.addEventListener('controllerchange',()=>{if(hadCtl)showUpdate()}); // a new service worker took over
  sw.register('sw.js').then(reg=>{
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState!=='visible'||Date.now()-last<60e3)return;last=Date.now();
      reg.update().catch(()=>{});if(sw.controller)sw.controller.postMessage({type:'check'});
    });
  }).catch(()=>{});
}
function showUpdate(){
  if($('.updbar'))return;const b=document.createElement('div');b.className='updbar';b.setAttribute('role','status');
  b.innerHTML=`<span>New version ready</span><button class="btn primary">Reload</button>`;
  $('button',b).addEventListener('click',()=>location.reload());document.body.appendChild(b);
}
boot();
})();
